<div class="ws-tabs" role="tablist" aria-label="Werkruimte">
  <button
    type="button"
    role="tab"
    class="ws-tab"
    [class.active]="sql.view().kind === 'object'"
    [attr.aria-selected]="sql.view().kind === 'object'"
    (click)="showObject()"
  >
    @if (selected(); as s) {
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        @if (s.kind === 'view') {
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
          <circle cx="12" cy="12" r="3" />
        } @else {
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 10h18M9 10v10" />
        }
      </svg>
      <span class="mono tl">{{ s.name }}</span>
    } @else {
      <span class="tl">Overzicht</span>
    }
  </button>

  @for (tab of sql.tabs(); track tab.id) {
    <div
      class="ws-tab ws-tab-sql"
      [class.active]="sql.view().kind === 'sql' && sql.activeTab()?.id === tab.id"
      (auxclick)="onAuxClick(tab, $event)"
    >
      <button
        type="button"
        role="tab"
        class="ws-tab-main"
        [attr.aria-selected]="sql.activeTab()?.id === tab.id"
        (click)="showTab(tab)"
      >
        @if (tab.running) {
          <span class="spinner" aria-label="bezig"></span>
        } @else {
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M8 6l-6 6 6 6M16 6l6 6-6 6" />
          </svg>
        }
        <span class="tl">{{ tab.title }}</span>
      </button>
      <button
        type="button"
        class="ws-tab-close"
        [attr.aria-label]="tab.title + ' sluiten'"
        (click)="close(tab, $event)"
      >
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  }

  <button type="button" class="ws-new" title="Nieuw SQL-tabblad" (click)="newTab()">
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
    SQL
  </button>
</div>

<div class="ws-body">
  @if (sql.view().kind === 'object') {
    @if (selected(); as object) {
      <app-object-view [object]="object" />
    } @else {
      <app-connection-home [connection]="connection()" (newSql)="newTab()" />
    }
  } @else {
    <!-- One-item loop keyed by tab id: another tab gets its own editor instance. -->
    @for (tab of activeTabs(); track tab.id) {
      @defer (on immediate) {
        <app-sql-panel [tab]="tab" [connectionId]="connection().id" />
      } @placeholder {
        <div class="dt-empty muted">Editor laden…</div>
      }
    }
  }
</div>

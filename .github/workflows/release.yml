name: Release

# Pushing a version tag (v0.2.0 = step 2) builds the Windows .exe files and publishes them
# as a GitHub Release. See "Releases" in the README.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that package.json version matches the tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME hoort niet bij package.json-versie $version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          args=(--title "DB Viewer $GITHUB_REF_NAME")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" release/*.exe "${args[@]}"

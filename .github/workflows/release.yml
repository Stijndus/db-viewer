name: Release

# A new version in package.json on main (v0.3.0 = step 3) builds the Windows .exe files and
# publishes them as a GitHub Release; the workflow creates the tag itself. Pushes that keep the
# version unchanged do nothing. See "Releases" in the README.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.exists.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al; niets te doen."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          args=(--title "DB Viewer $TAG" --target "$GITHUB_SHA")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          # latest.yml and the blockmap let installed apps find and download the update.
          gh release create "$TAG" release/*.exe release/*.exe.blockmap release/latest.yml "${args[@]}"
